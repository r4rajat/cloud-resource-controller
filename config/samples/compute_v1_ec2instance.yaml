apiVersion: compute.r4rajat.com/v1
kind: EC2Instance
metadata:
  labels:
    app.kubernetes.io/name: cloud-resoure-controller
    app.kubernetes.io/managed-by: kustomize
  name: ec2instance-sample
spec:
  instanceName: "my-ec2-instance"
  amiID: "ami-0bdc7d025135d7b49"
  sshKeyName: "my-rsa-keypair"
  instanceType: "t3.micro"
  subnet: "subnet-0521abfda996463f5"
  securityGroups:
    - sg-04d98c33d289f2dc5
  userData: |
    #!/bin/bash
    yum update -y
    yum install -y httpd
    systemctl start httpd
    systemctl enable httpd
  region: "us-east-1"
  associatePublicIP: true
  tags:
    environment: "dev"
    owner: "r4rajat"
  storage:
    rootVolume:
      size: 10
      type: "gp2"
    additionalVolumes:
      - size: 10
        type: "gp3"
        deviceName: "/dev/sdb"
        encrypted: false
      - size: 10
        type: "gp3"
        deviceName: "/dev/sdc"
        encrypted: true

  